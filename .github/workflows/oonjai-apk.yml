name: Oonjai APK

on:
  push:
    paths: ['oonjai/**', '.github/workflows/oonjai-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oonjai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      # ใส่ google-services.json จาก GitHub Secrets (ถ้ามี)
      - name: google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > app-elder/google-services.json
            cp app-elder/google-services.json app-caregiver/google-services.json
          fi
      - run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: oonjai-apks
          path: oonjai/app-*/build/outputs/apk/debug/*.apk
