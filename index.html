<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inside Bunker</title>
<meta name="description" content="Senritha's personal operating system: every Senritha-Bunker app in one place.">
<meta name="theme-color" content="#080B12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inside Bunker">
<link rel="icon" href="inside-bunker/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="inside-bunker/style.css">
</head>
<body>
<!-- Inside Bunker: Senritha's personal OS. Apps open as their own pages (not frames) so each runs at full speed. -->
<div class="os" id="os">

  <header class="bar">
    <button class="ib side-toggle" id="sideToggle" aria-label="Toggle sidebar" data-tip="Sidebar"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
    <a class="brand" href="#" aria-label="Inside Bunker home">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v8.5h11V10"/><path class="a" d="M10 18.5v-4h4v4"/></svg></span>
      <span class="brand-name">Inside Bunker</span>
    </a>
    <button class="search-trigger" id="searchOpen" aria-label="Search apps">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <span>Search apps</span><kbd id="kbdHint">⌘K</kbd>
    </button>
    <div class="bar-right">
      <div class="status" id="status" data-tip="Connection"><i></i><span>Online</span></div>
      <time class="clock" id="clock" data-tip="Today"><span id="clockDate"></span><b id="clockTime"></b></time>
      <button class="ib mobile-search" id="searchOpen2" aria-label="Search apps"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
      <div class="pop-wrap">
        <button class="ib" id="notifBtn" aria-label="Notifications" aria-expanded="false" data-tip="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></button>
        <div class="pop" id="notifPop" role="dialog" aria-label="Notifications" hidden>
          <header><b>Notifications</b></header>
          <div class="empty sm"><svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><b>You're all caught up</b><p>Bunker apps don't send notifications yet. When one does, it will show here.</p></div>
        </div>
      </div>
      <a class="ib settings-link" href="#settings" aria-label="Settings" data-tip="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg></a>
      <a class="avatar" id="avatar" href="#settings" aria-label="Profile and settings" data-tip="Profile"></a>
    </div>
  </header>

  <nav class="side" id="side" aria-label="Main">
    <div class="side-scroll">
      <a class="nav" href="#" data-route="home" data-tip="Home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/></svg><span>Home</span></a>
      <a class="nav" href="#apps" data-route="apps" data-tip="All applications"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg><span>All applications</span><em id="navCount"></em></a>
      <a class="nav" href="#recent" data-route="recent" data-tip="Recent apps"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg><span>Recent apps</span></a>
      <a class="nav" href="#favorites" data-route="favorites" data-tip="Favorites"><svg viewBox="0 0 24 24"><path d="m12 4.5 2.3 4.7 5.2.8-3.8 3.6.9 5.2L12 16.4l-4.6 2.4.9-5.2-3.8-3.6 5.2-.8z"/></svg><span>Favorites</span><em id="navFav"></em></a>
      <a class="nav" href="#categories" data-route="categories" data-tip="Categories"><svg viewBox="0 0 24 24"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6H10l2 2h6.5A1.5 1.5 0 0 1 20 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/></svg><span>Categories</span></a>
      <div class="cats" id="sideCats"></div>
    </div>
    <div class="side-foot">
      <a class="nav" href="#settings" data-route="settings" data-tip="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg><span>Settings</span></a>
    </div>
  </nav>
  <div class="side-scrim" id="sideScrim"></div>

  <main class="main" id="main" tabindex="-1">
    <div class="view" id="view"></div>
  </main>

  <nav class="dock" aria-label="Main">
    <a href="#" data-route="home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/></svg><span>Home</span></a>
    <a href="#apps" data-route="apps"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg><span>Apps</span></a>
    <a href="#recent" data-route="recent"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg><span>Recent</span></a>
    <a href="#favorites" data-route="favorites"><svg viewBox="0 0 24 24"><path d="m12 4.5 2.3 4.7 5.2.8-3.8 3.6.9 5.2L12 16.4l-4.6 2.4.9-5.2-3.8-3.6 5.2-.8z"/></svg><span>Favorites</span></a>
    <a href="#settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg><span>Settings</span></a>
  </nav>

  <div class="palette" id="palette" hidden>
    <div class="palette-scrim" data-close></div>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search apps">
      <label class="palette-input"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="q" type="text" placeholder="Search by name or description" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list">
        <kbd>Esc</kbd></label>
      <div class="chips" id="qCats" role="group" aria-label="Filter by category"></div>
      <div class="results" id="results" role="listbox" aria-label="Apps"></div>
      <footer class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>Esc</kbd> close</span></footer>
    </div>
  </div>

  <div class="launch" id="launch" aria-live="polite" hidden><div class="launch-card"><span class="launch-icon" id="launchIcon"></span><b id="launchName"></b><span class="launch-bar"><i></i></span></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script src="inside-bunker/app.js"></script>
</body>
</html>
