<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Senritha's Work Space</title>
<meta name="description" content="Your own workspace: channels, sub-channels, messages and images, saved on this device.">
<meta name="theme-color" content="#1A1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Space">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app" data-view="list">

  <aside class="side" id="side">
    <div class="ws">
      <span class="ws-mark" aria-hidden="true">S</span>
      <div class="ws-name"><b>Senritha's Work Space</b><small id="wsSub">Saved on this device</small></div>
      <button class="icon" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <label class="search" for="q"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search messages" autocomplete="off"><kbd>⌘K</kbd></label>
    <div class="side-scroll">
      <div class="sec-head"><span>Channels</span><button class="icon sm" id="addRoot" aria-label="New channel"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <nav class="tree" id="tree" role="tree" aria-label="Channels"></nav>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="ch-head">
      <button class="icon back" id="back" aria-label="Back to channels"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="head-acts">
        <button class="hbtn" id="pinsBtn" aria-label="Pinned messages"><svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg><span id="pinCount">0</span></button>
        <button class="icon" id="chMenuBtn" aria-label="Channel options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
      </div>
    </header>
    <div class="subs" id="subs"></div>
    <div class="msgs" id="msgs"><div class="msg-list" id="msgList"></div></div>
    <div class="composer-slot" id="mainComposer"></div>
    <div class="drop-hint" id="dropHint"><span>Drop images to attach</span></div>
  </main>

  <aside class="thread" id="thread" aria-label="Thread">
    <header class="th-head"><button class="icon back" id="thBack" aria-label="Close thread"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div><b>Thread</b><small id="thWhere"></small></div><button class="icon x" id="thClose" aria-label="Close thread"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="msgs" id="thMsgs"><div class="msg-list" id="thList"></div></div>
    <div class="composer-slot" id="thComposer"></div>
  </aside>

  <section class="search-panel" id="searchPanel" aria-label="Search results">
    <header><button class="icon" id="searchClose" aria-label="Close search"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><b id="searchTitle">Search</b></header>
    <div class="results" id="results"></div>
  </section>

  <div class="pop" id="pinsPop" role="dialog" aria-label="Pinned messages"><header><b>Pinned</b><button class="icon sm" data-closepop aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="pop-body" id="pinsList"></div></div>
  <div class="pop menu-pop" id="menuPop" role="menu"></div>
  <div class="pop emoji-pop" id="emojiPop" role="dialog" aria-label="Pick an emoji"></div>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog"></section>
  <section class="modal" id="modal" role="dialog" aria-modal="true"></section>

  <div class="lightbox" id="lightbox" aria-hidden="true"><img alt="" id="lbImg"><div class="lb-bar"><span id="lbCount"></span><button class="icon" id="lbClose" aria-label="Close image"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <button class="lb-nav prev" id="lbPrev" aria-label="Previous image"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="lb-nav next" id="lbNext" aria-label="Next image"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
