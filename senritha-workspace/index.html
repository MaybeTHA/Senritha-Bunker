<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Senritha's Work Space</title>
<meta name="description" content="Every Senritha project in one menu. Pick one to open it.">
<meta name="theme-color" content="#EFEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Space">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<!-- Each app opens as its own page (not inside a frame), so it gets the whole GPU, full screen and its own permissions. -->
<main class="wrap">
  <header class="top">
    <div>
      <h1>Senritha's Work Space</h1>
      <p class="path">senritha-bunker /</p>
    </div>
    <button class="icon" id="theme" aria-label="Switch theme" title="Switch theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  </header>

  <nav class="list" id="list" aria-label="Apps"></nav>

  <p class="foot">Each app opens on its own page and runs at full speed. Use back to return here.</p>
</main>
<script src="menu.js"></script>
</body>
</html>
